# =============================================================================
# content.yaml — ALL site content lives in this one file.
#
# How to edit
#   - Change any text between quotes, save, then run:  npm run build
#   - Anything that starts with "TO BE SUPPLIED" is a placeholder. Replace the
#     whole value with the real one. Search this file for TO BE SUPPLIED to
#     find them all. The build also prints the list.
#   - Files (resume PDF, screenshots) go in the public/ folder. Write only the
#     filename here, for example:  resume: "resume.pdf"
#   - In text you can use **bold** and [link text](https://example.com).
#   - To add a project, copy one whole block under "projects:" and edit it.
#     It gets a card and its own page automatically.
#   - Keep the indentation (two spaces). Do not use tabs.
# =============================================================================

site:
  name: "Akshay Mamilla"
  # Full address of the live site. Used for the sitemap and for the canonical
  # links search engines read.
  url: "https://akshaymamilla.com"
  # true  = draft preview. Unfinished buttons look finished but do nothing, and
  #         unfinished text shows a small "to be supplied" marker. A "Draft
  #         preview" button in the corner outlines everything still missing.
  # false = unfinished items are hidden from visitors. Set this before sharing
  #         the site with recruiters.
  showPlaceholders: false
  footerLine: "Akshay Mamilla · Houston, TX · Open to roles in Houston, across Texas and remote"

contact:
  email: "TO BE SUPPLIED: email"
  phone: "TO BE SUPPLIED: phone"
  linkedin: "TO BE SUPPLIED: LinkedIn URL"
  github: "TO BE SUPPLIED: GitHub URL"
  # Put the PDF in public/ and write its filename here.
  resume: "TO BE SUPPLIED: resume PDF"

