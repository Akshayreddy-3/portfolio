# HOME
# -----------------------------------------------------------------------------
home:
  pageTitle: "Akshay Mamilla | Data, Software, AI and IT Support | Houston, TX"
  metaDescription: "Portfolio of Akshay Mamilla, an MIS graduate student at the University of Houston-Clear Lake working in data analysis, frontend development, AI and IT support. Based in Houston, TX."
  eyebrow: "Houston, TX"
  heading: "Akshay Mamilla"
  subheading: "Data analysis, software, AI and IT support, based in Houston, TX"
  intro:
    - "I'm finishing an MS in Management Information Systems at the University of Houston-Clear Lake, graduating in December 2026. I build Power BI dashboards, write Python and SQL, develop React frontends and support the systems people rely on."
    - "I'm open to full-time roles and internships in Houston, across Texas and remote."

  areasEyebrow: "What I do"
  areasHeading: "Four areas, one toolkit"
  areas:
    - title: "Data analysis and BI"
      art: "chart"
      text: "I built a Power BI dashboard for monitoring CT and MRI equipment fleets during my internship at United Imaging Healthcare, including the data model and DAX measures behind it. Earlier, I interned in data analytics with AICTE / VOIS for Tech."
    - title: "Software and frontend"
      art: "code"
      text: "I build with React and Python, and I test what I ship: my Google Drive organizer has 45 unit tests. I was a frontend intern with IBM SkillsBuild."
    - title: "AI and machine learning"
      art: "nodes"
      text: "I built a document classifier on the Gemini Vision API for a real staffing agency. I was an AI research intern at A Square Solutions, and I've helped in Python and Data Analytics with AI lab sessions at UHCL."
    - title: "IT and systems support"
      art: "network"
      text: "I worked as a Remote Services Support Intern at United Imaging Healthcare. I hold the AWS Cloud Practitioner and CCST Networking certifications."

  skillsHeading: "Skills"
  skills:
    - "Python"
    - "SQL"
    - "Power BI"
    - "React / frontend development"
    - "AWS"

  featuredEyebrow: "Projects"
  featuredHeading: "Recent projects"

  aboutHeading: "About me"
  about:
    - "I came to information systems from engineering. My undergraduate background is in Electronics and Communication Engineering at JNTU, and I'm now completing an MS in Management Information Systems at the University of Houston-Clear Lake."
    - "At UHCL I've been a Graduate Teaching Assistant for ISAM 1305, Business Computer Applications."
    - "I live in Houston, TX."

  cta:
    heading: "Hiring for a data, software, AI or IT support role?"
    text: "I'd like to hear about it. Download my resume or send me an email."

