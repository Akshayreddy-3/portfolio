projectsPage:
  pageTitle: "Projects | Akshay Mamilla | Python, AI and Power BI"
  metaDescription: "Projects by Akshay Mamilla: an AI document classifier for Google Drive built in Python, and a Power BI equipment monitoring dashboard."
  heading: "Projects"
  intro:
    - "These are projects I built for real users: a Python and AI tool for a staffing agency, and a Power BI dashboard from my internship at United Imaging Healthcare. Each one has a short case study covering the problem, what I built and the result."
  cta:
    heading: "Want to talk through one of these?"
    text: ""

# -----------------------------------------------------------------------------
# PROJECTS — copy a whole block (from "- slug:" down) to add another.
#   slug             the page address: /projects/<slug>/  (lowercase, hyphens)
#   featured         true = also shown on the Home page
#   art              illustration on its tile: "sorter", "dashboard", "chart", "code",
#                    "nodes" or "network". Leave it out for a plain pattern.
#   summary          card text on the Projects page
#   featuredSummary  card text on the Home page
#   metrics          big figures. Real numbers only.
#   glance           the "At a glance" list
#   sections         heading + paragraphs and/or bullets
#   links            buttons such as a GitHub repo
#   screenshots      files in public/, each with alt text and a caption
#   closingSections  optional sections shown after the screenshots
# -----------------------------------------------------------------------------
projects:
  - slug: "google-drive-organizer"
    featured: true
    title: "Google Drive Organizer and Document Classifier"
    art: "sorter"
    pageTitle: "Google Drive Organizer and AI Document Classifier | Akshay Mamilla"
    metaDescription: "A Python tool that uses the Gemini Vision API and Google Drive API to classify, rename and file documents for a staffing agency, cutting manual file management by 95%."
    tags: ["Python", "Gemini Vision API", "Google Drive API", "AES-256"]
    summary: "Classifies, renames and files documents for a staffing agency. 45 unit tests. 95% less manual file management."
    featuredSummary: "An AI tool built for a staffing agency that classifies, renames and files documents in Google Drive. It cut manual file management by 95%."
    intro:
      - "An AI document classifier that keeps a staffing agency's Google Drive organized. It reads each file with the Gemini Vision API, works out what kind of document it is, gives it a consistent name and moves it to the right folder."
    metrics:
      - figure: "95%"
        label: "less manual file management"
      - figure: "45"
        label: "unit tests"
    glance:
      - label: "Built for"
        value: "a staffing agency"
      - label: "My role"
        value: "solo developer"
      - label: "Tech"
        value: "Python, Gemini Vision API, Google Drive API, AES-256 encryption"
      - label: "Tests"
        value: "45 unit tests"
      - label: "Result"
        value: "95% reduction in manual file management"
    sections:
      - heading: "The problem"
        paragraphs:
          - "A staffing agency handles a steady flow of documents, and each one had to be opened, identified, renamed and filed by hand."
      - heading: "What I built"
        bullets:
          - "**Classification.** The Gemini Vision API reads each file and decides what type of document it is."
          - "**Renaming.** Files get consistent names based on their contents."
          - "**Filing.** The tool moves each file into the right Google Drive folder through the Google Drive API."
          - "**Encryption.** Sensitive data is protected with AES-256 encryption."
          - "**Testing.** 45 unit tests cover the tool."
      - heading: "The result"
        paragraphs:
          - "Manual file management at the agency dropped by 95%."
    mediaHeading: "Code and screenshots"
    mediaNote: ""
    links:
      - label: "GitHub repository"
        url: "TO BE SUPPLIED: public repo URL"
    screenshots:
      - file: "TO BE SUPPLIED: screenshots with no client data visible"
        alt: "Screenshot of the Google Drive Organizer and Document Classifier"
        caption: ""
    cta:
      heading: "Need something similar automated?"
      text: "I'm happy to walk through how this works."

  - slug: "equipment-monitoring-dashboard"
    featured: true
    title: "Equipment Monitoring Dashboard"
    art: "dashboard"
    pageTitle: "Equipment Monitoring Dashboard in Power BI | Akshay Mamilla"
    metaDescription: "A two-page Power BI dashboard for monitoring CT and MRI equipment fleets, with a data model and DAX measures built on equipment-monitoring exports."
    tags: ["Power BI", "DAX", "Data modeling"]
    summary: "An executive summary and a device drill-down view for CT and MRI equipment fleets."
    featuredSummary: "A two-page Power BI dashboard for monitoring CT and MRI equipment fleets, built during my internship at United Imaging Healthcare."
    intro:
      - "A Power BI dashboard for monitoring fleets of CT and MRI equipment. I built it during my internship at United Imaging Healthcare, from the data model and DAX measures through to the two report pages."
    metrics: []
    glance:
      - label: "Built during"
        value: "Remote Services Support internship, United Imaging Healthcare"
      - label: "Tool"
        value: "Power BI"
      - label: "Work"
        value: "data modeling and DAX measures on equipment-monitoring exports"
      - label: "Pages"
        value: "executive summary and device detail / drill-down"
      - label: "Built for"
        value: "managers and the support team"
    sections:
      - heading: "What I built"
        bullets:
          - "**A data model** built on equipment-monitoring exports."
          - "**DAX measures** that drive the figures on both pages."
          - "**An executive summary page** that gives managers a view of the fleet at a glance."
          - "**A device detail page** that lets the support team drill down into a single device."
      - heading: "What it tracks"
        paragraphs:
          - "The dashboard covers equipment status and health, alerts and errors, and uptime across the fleet."
    mediaHeading: "Screenshots"
    mediaNote: "The images below come from a rebuilt version of the dashboard that runs on sample data. They contain no real equipment, customer or site information."
    links: []
    screenshots:
      - file: "TO BE SUPPLIED: screenshot from the sample-data rebuild"
        alt: "Executive summary page of the equipment monitoring dashboard, shown with sample data"
        caption: "Executive summary page"
      - file: "TO BE SUPPLIED: screenshot from the sample-data rebuild"
        alt: "Device detail page of the equipment monitoring dashboard, shown with sample data"
        caption: "Device detail page"
    # Sections shown after the screenshots.
    closingSections:
      - heading: "Confidentiality"
        paragraphs:
          - "This work was done for an employer, so this page describes it in general terms. It leaves out internal system names, customers, sites and real figures."
    cta:
      heading: "Looking for someone to build Power BI reports?"
      text: "I can walk you through the model and measures."

